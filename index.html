<script>
  // Integração de captura de leads — Google Sheets.
  (() => {
    const LEADS_ENDPOINT = "https://script.google.com/macros/s/AKfycbw9DBXpE3hJXm-cyCFufhniPgHE0AWUx00L1e6p44od9kCVXf6yd6q3jHb9gOHD4TA/exec";
    const form = document.getElementById("atendimentoForm");
    if (!form) return;

    form.addEventListener("submit", () => {
      const nome = document.getElementById("nome").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const email = document.getElementById("email").value.trim();
      const resumo = document.getElementById("resumo").value.trim();
      const area = document.getElementById("areaSelecionada").value;
      const consentimento = document.getElementById("consentimento").checked;

      if (!nome || !telefone || !area || !consentimento) return;

      const params = new URLSearchParams(window.location.search);
      const dados = new URLSearchParams({
        nome,
        telefone,
        email,
        area,
        resumo,
        consentimento: "Sim",
        origem: "Site",
        pagina: window.location.href,
        utm_source: params.get("utm_source") || "",
        utm_medium: params.get("utm_medium") || "",
        utm_campaign: params.get("utm_campaign") || ""
      });

      fetch(LEADS_ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        body: dados,
        keepalive: true
      }).catch(() => {});
    }, true);
  })();
</script>
