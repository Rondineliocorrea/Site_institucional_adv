name: Corrigir menu mobile

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-menu.yml'

permissions:
  contents: write

jobs:
  fix-mobile-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar somente a correção do menu mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = [
            (
              '.menu-btn{display:none;background:none;border:0;color:#fff;font-size:28px}',
              '.menu-btn{display:none;background:none;border:0;color:#fff;font-size:28px}\n    .mobile-menu{display:none}'
            ),
            (
              '''      .nav,.header-cta{display:none}\n      .menu-btn{display:block}\n      .hero{padding-top:76px}''',
              '''      .nav,.header-cta{display:none}\n      .menu-btn{display:block;position:relative;z-index:22;width:46px;height:46px;padding:0;font-size:31px;line-height:1}\n      .mobile-menu{\n        display:none;position:fixed;inset:76px 0 0;z-index:19;\n        background:rgba(6,24,44,.985);border-top:1px solid rgba(255,255,255,.08);\n        overflow-y:auto;\n      }\n      .mobile-menu.open{display:block}\n      .mobile-menu-inner{padding:34px 17px 42px}\n      .mobile-nav{display:grid}\n      .mobile-nav a{\n        padding:19px 4px;border-bottom:1px solid rgba(255,255,255,.10);\n        color:rgba(255,255,255,.88);font-family:var(--serif);font-size:31px;line-height:1.1;\n      }\n      .mobile-nav a:hover,.mobile-nav a:focus{color:var(--gold-soft)}\n      .mobile-menu-cta{\n        margin-top:28px;width:100%;min-height:56px;border:1px solid var(--gold);\n        background:var(--gold-soft);color:#07182c;font-weight:700;font-size:15px;\n        display:flex;align-items:center;justify-content:center;border-radius:3px;\n      }\n      body.mobile-menu-open{overflow:hidden}\n      body.mobile-menu-open .header{background:var(--navy)}\n      .hero{padding-top:76px}'''
            ),
            (
              '''      <button class="menu-btn" aria-label="Abrir menu">☰</button>\n    </div>\n  </header>\n\n  <main>''',
              '''      <button class="menu-btn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileMenu">☰</button>\n    </div>\n  </header>\n\n  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">\n    <div class="container mobile-menu-inner">\n      <nav class="mobile-nav" aria-label="Navegação mobile">\n        <a href="#inicio">Início</a>\n        <a href="#advogado">O Advogado</a>\n        <a href="#atuacao">Atuação</a>\n        <a href="#conteudos">Conteúdos</a>\n        <a href="#contato">Contato</a>\n      </nav>\n      <a class="mobile-menu-cta open-modal-link" href="#" data-area="Atendimento geral">Fale com o advogado</a>\n    </div>\n  </div>\n\n  <main>'''
            ),
            (
              '''  <script>\n    const WA = "5567996119098";''',
              '''  <script>\n    const menuBtn = document.querySelector(".menu-btn");\n    const mobileMenu = document.getElementById("mobileMenu");\n\n    function closeMobileMenu() {\n      if(!menuBtn || !mobileMenu) return;\n      mobileMenu.classList.remove("open");\n      mobileMenu.setAttribute("aria-hidden", "true");\n      menuBtn.setAttribute("aria-expanded", "false");\n      menuBtn.setAttribute("aria-label", "Abrir menu");\n      menuBtn.textContent = "☰";\n      document.body.classList.remove("mobile-menu-open");\n    }\n\n    if(menuBtn && mobileMenu) {\n      menuBtn.addEventListener("click", () => {\n        const isOpen = mobileMenu.classList.toggle("open");\n        mobileMenu.setAttribute("aria-hidden", String(!isOpen));\n        menuBtn.setAttribute("aria-expanded", String(isOpen));\n        menuBtn.setAttribute("aria-label", isOpen ? "Fechar menu" : "Abrir menu");\n        menuBtn.textContent = isOpen ? "×" : "☰";\n        document.body.classList.toggle("mobile-menu-open", isOpen);\n      });\n\n      mobileMenu.querySelectorAll("a").forEach(link => {\n        link.addEventListener("click", closeMobileMenu);\n      });\n\n      document.addEventListener("keydown", event => {\n        if(event.key === "Escape" && mobileMenu.classList.contains("open")) closeMobileMenu();\n      });\n\n      window.addEventListener("resize", () => {\n        if(window.innerWidth > 850 && mobileMenu.classList.contains("open")) closeMobileMenu();\n      });\n    }\n\n    const WA = "5567996119098";'''
            )
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit('Trecho esperado não encontrado. Nenhuma alteração foi gravada.')
            text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

          git diff --check -- index.html
          test "$(git diff --name-only)" = "index.html"

      - name: Commit da correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige funcionamento do menu mobile"
          git push
