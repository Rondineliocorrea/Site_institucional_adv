{% assign image_data = tail | split: '"' | first %}
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <image width="1000" height="1000" href="data:image/webp;base64,{{ image_data | strip }}" />
</svg>
